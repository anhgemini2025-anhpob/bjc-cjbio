<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth" data-theme="dark" data-font-scale="md">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>BJC Specialties Vietnam × CJ BIO | Executive Presentation (15 Oct 2026)</title>

  <!-- Google Fonts: Plus Jakarta Sans, Inter & Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Inter"', '"Noto Sans KR"', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
          },
          colors: {
            bjc: {
              emerald: '#008A4B',
              forest: '#1A3A2A'
            },
            cj: {
              blue: '#0055A5',
              amber: '#EF7C00',
              red: '#E31B23'
            }
          }
        }
      }
    };
  </script>

  <style>
    /* ==========================================================================
       1. ANTI-COPY PROTECTION & DYNAMIC FONT SIZE SCALING
       ========================================================================== */
    *, *::before, *::after {
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html[data-font-scale="sm"] { font-size: 14px; }
    html[data-font-scale="md"] { font-size: 16px; }
    html[data-font-scale="lg"] { font-size: 18px; }
    html[data-font-scale="xl"] { font-size: 20px; }

    /* ==========================================================================
       2. DARK / LIGHT HYBRID THEME SYSTEM
       ========================================================================== */
    :root, html[data-theme="dark"] {
      --bg-grad: linear-gradient(135deg, #0F172A 0%, #132238 50%, #1E293B 100%);
      --text-main: #F8FAFC;
      --text-muted: #CBD5E1;
      --card-bg: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.14);
      --subcard-bg: rgba(15, 23, 42, 0.72);
      --header-bg: rgba(15, 23, 42, 0.85);
      --watermark-color: #ffffff;
      --watermark-opacity: 0.038;
    }

    html[data-theme="light"] {
      --bg-grad: linear-gradient(135deg, #F8FAFC 0%, #EEF2F6 50%, #E2E8F0 100%);
      --text-main: #0F172A;
      --text-muted: #334155;
      --card-bg: rgba(255, 255, 255, 0.92);
      --card-border: rgba(15, 23, 42, 0.12);
      --subcard-bg: rgba(248, 250, 252, 0.96);
      --header-bg: rgba(255, 255, 255, 0.90);
      --watermark-color: #0F172A;
      --watermark-opacity: 0.035;
    }

    body {
      background: var(--bg-grad);
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
      min-height: 100dvh;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.18);
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .glass-subcard {
      background: var(--subcard-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.2s ease;
    }

    /* Light Mode Text & Surface Overrides for High Contrast Readability */
    html[data-theme="light"] .text-white {
      color: #0F172A !important;
    }
    html[data-theme="light"] .text-slate-200,
    html[data-theme="light"] .text-slate-300 {
      color: #334155 !important;
    }
    html[data-theme="light"] .text-slate-400 {
      color: #475569 !important;
    }
    html[data-theme="light"] .text-emerald-300,
    html[data-theme="light"] .text-emerald-400 {
      color: #007A42 !important;
    }
    html[data-theme="light"] .text-emerald-100,
    html[data-theme="light"] .text-emerald-200 {
      color: #065F46 !important;
    }
    html[data-theme="light"] .text-blue-200,
    html[data-theme="light"] .text-blue-300,
    html[data-theme="light"] .text-blue-400 {
      color: #0055A5 !important;
    }
    html[data-theme="light"] .text-amber-200,
    html[data-theme="light"] .text-amber-300,
    html[data-theme="light"] .text-amber-400 {
      color: #B45309 !important;
    }
    html[data-theme="light"] .text-red-200,
    html[data-theme="light"] .text-red-300 {
      color: #B91C1C !important;
    }
    html[data-theme="light"] .bg-slate-900,
    html[data-theme="light"] .bg-slate-900\/90,
    html[data-theme="light"] .bg-slate-900\/85,
    html[data-theme="light"] .bg-slate-900\/80,
    html[data-theme="light"] .bg-slate-900\/75,
    html[data-theme="light"] .bg-slate-900\/70,
    html[data-theme="light"] .bg-slate-800\/95,
    html[data-theme="light"] .bg-slate-800\/90,
    html[data-theme="light"] .bg-slate-800\/80 {
      background-color: #FFFFFF !important;
      border-color: rgba(15, 23, 42, 0.14) !important;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }
    html[data-theme="light"] .bg-slate-950\/80,
    html[data-theme="light"] .bg-slate-950\/70,
    html[data-theme="light"] .bg-slate-950\/60 {
      background-color: rgba(241, 245, 249, 0.92) !important;
      border-color: rgba(15, 23, 42, 0.12) !important;
    }
    html[data-theme="light"] .bg-white\/5,
    html[data-theme="light"] .bg-white\/10 {
      background-color: rgba(15, 23, 42, 0.045) !important;
      border-color: rgba(15, 23, 42, 0.12) !important;
    }
    html[data-theme="light"] .bg-emerald-950\/70,
    html[data-theme="light"] .bg-emerald-950\/60,
    html[data-theme="light"] .bg-emerald-950\/50,
    html[data-theme="light"] .bg-emerald-950\/45,
    html[data-theme="light"] .bg-emerald-950\/40,
    html[data-theme="light"] .bg-emerald-950\/35 {
      background-color: #ECFDF5 !important;
      border-color: rgba(0, 138, 75, 0.35) !important;
    }
    html[data-theme="light"] .bg-blue-950\/50,
    html[data-theme="light"] .bg-blue-950\/45,
    html[data-theme="light"] .bg-blue-950\/40 {
      background-color: #EFF6FF !important;
      border-color: rgba(0, 85, 165, 0.3) !important;
    }
    html[data-theme="light"] .bg-red-950\/35 {
      background-color: #FEF2F2 !important;
      border-color: rgba(227, 27, 35, 0.3) !important;
    }
    html[data-theme="light"] .keep-white-text,
    html[data-theme="light"] .keep-white-text * {
      color: #FFFFFF !important;
    }

    /* Tilted Repeated Confidential Watermark Overlay */
    #watermark-layer {
      position: fixed;
      inset: -40%;
      z-index: 35;
      pointer-events: none;
      display: grid;
      grid-template-columns: repeat(4, minmax(340px, 1fr));
      gap: 5rem 3rem;
      transform: rotate(-24deg);
      opacity: var(--watermark-opacity);
      overflow: hidden;
    }

    .watermark-item {
      font-family: 'Plus Jakarta Sans', monospace;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      white-space: nowrap;
      color: var(--watermark-color);
    }

    /* Subtle Red Shake Animation for Incorrect Password */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }

    .animate-shake {
      animation: shake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      border-color: rgba(227, 27, 35, 0.8) !important;
      box-shadow: 0 0 35px rgba(227, 27, 35, 0.35) !important;
    }

    /* Hide Scrollbar on Horizontal Pill Navs */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Safe Area Padding for iPhone Bottom Bar */
    .pb-safe {
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
    }
  </style>
</head>

<body class="antialiased selection:bg-emerald-500 selection:text-white relative pb-20 lg:pb-8">

  <!-- Ambient Brand Glow Blobs -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute -top-32 -left-32 w-[450px] h-[450px] rounded-full bg-[#008A4B]/15 blur-[120px]"></div>
    <div class="absolute top-1/3 -right-32 w-[450px] h-[450px] rounded-full bg-[#0055A5]/15 blur-[130px]"></div>

  <div id="watermark-layer" aria-hidden="true"></div>

  <!-- ==========================================================================
       GATEKEEPER PASSWORD SCREEN ("BjcCj2026")
       ========================================================================== -->
  <div id="gatekeeper-overlay" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-2xl transition-opacity duration-400">
    <div id="gk-card" class="w-full max-w-md rounded-3xl bg-slate-900/95 border border-white/20 p-6 sm:p-8 shadow-2xl relative overflow-hidden">
      <div class="absolute top-0 inset-x-0 h-1.5 bg-gradient-to-r from-[#008A4B] via-[#0055A5] to-[#EF7C00]"></div>

      <!-- Top Bar: Badge & Language Switcher -->

        <span id="gk-badge" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold tracking-wider uppercase bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">
          CONFIDENTIAL BRIEFING
        </span>
        <div class="flex items-center gap-1 bg-slate-950/80 p-1 rounded-lg border border-white/10">
          <button onclick="setLanguage('en')" data-lang-btn="en" class="px-2 py-1 rounded text-xs font-bold bg-emerald-600 text-white keep-white-text">EN</button>
          <button onclick="setLanguage('vi')" data-lang-btn="vi" class="px-2 py-1 rounded text-xs font-semibold text-slate-300">VI</button>
          <button onclick="setLanguage('ko')" data-lang-btn="ko" class="px-2 py-1 rounded text-xs font-semibold text-slate-300">KO</button>
        </div>
      </div>

      <!-- Dual Logos Display -->
      <div class="flex items-center justify-center gap-4 bg-white rounded-2xl p-3.5 mb-5 shadow-inner border border-slate-200">
        <img src="/Logo BJC specialties.jpg" onerror="this.src='Logo BJC specialties.jpg'" alt="BJC Specialties Logo" class="h-8 sm:h-10 object-contain" />
        <span class="text-slate-400 font-light text-xl">×</span>
        <img src="/Logo CJ bio.png" onerror="this.src='Logo CJ bio.png'" alt="CJ BIO Logo" class="h-8 sm:h-10 object-contain" />
      </div>

      <h1 id="gk-title" class="text-xl sm:text-2xl font-extrabold text-white text-center mb-1.5">
        BJC Specialties Vietnam × CJ BIO
      </h1>
      <p id="gk-subtitle" class="text-xs sm:text-sm text-emerald-300 font-semibold text-center mb-1.5">
        TasteNrich® HYBIND & AMINATURE® FGAA
      </p>
      <p id="gk-meta" class="text-[11px] text-slate-400 text-center mb-4">
        15 October 2026 · Presenter: Nguyen Duc Duy Anh - BJC Specialties Vietnam
      </p>

      <!-- Deep Link Destination Preview (Shown when opening a shared specific URL) -->
      <div id="gk-deeplink-banner" class="hidden mb-4 rounded-xl bg-emerald-500/15 border border-emerald-500/35 px-3 py-2 text-center">
        <div class="text-[10px] font-bold uppercase text-emerald-300">Direct Shared Link</div>
        <div id="gk-deeplink-path" class="text-xs font-mono font-bold text-white truncate mt-0.5"></div>
      </div>

      <!-- Password Form -->
      <form onsubmit="handleGatekeeperSubmit(event)" class="space-y-3.5">
        <div class="relative">
          <input
            id="gk-password-input"
            type="password"
            autocomplete="off"
            autofocus
            data-allow-copy="true"
            placeholder="Enter Access Code..."
            class="w-full px-4 py-3 pr-12 rounded-xl bg-slate-950/90 border border-white/20 text-white placeholder-slate-400 text-sm font-mono focus:outline-none focus:border-emerald-400 focus:ring-2 focus:ring-emerald-500/30 transition-all"
          />
          <button type="button" onclick="togglePasswordVisibility()" title="Show/Hide Password"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs font-mono px-1.5 py-1">
            👁
          </button>
        </div>

        <div id="gk-error-msg" class="hidden rounded-xl bg-red-500/15 border border-red-500/40 px-3 py-2 text-xs font-semibold text-red-300 text-center"></div>

        <button type="submit"
          class="keep-white-text w-full py-3 px-5 rounded-xl font-extrabold text-sm bg-gradient-to-r from-[#008A4B] via-emerald-600 to-[#0055A5] hover:from-emerald-500 hover:to-blue-500 text-white shadow-lg shadow-emerald-600/25 transition-all cursor-pointer flex items-center justify-center gap-2">
          <span id="gk-unlock-btn-text">Authenticate & Enter</span>

      <div id="gk-security-note" class="mt-4 pt-3 border-t border-white/10 text-[10px] text-slate-400 text-center">
        Protected by Anti-Copy Suite
      </div>
    </div>
  </div>

  <!-- ==========================================================================

       ========================================================================== -->

        <!-- Desktop Compact Tab Links -->
        <nav id="nav-tabs-container" class="hidden lg:flex items-center gap-1 overflow-x-auto py-1 no-scrollbar">

        </nav>

        <!-- Reader-Centric Controls: Share Link + Theme (Light/Dark) + Font Size (A-/A+) + Language + Lock -->
        <div class="flex items-center gap-1.5 shrink-0">
          <!-- Share Current Position Button -->
          <button onclick="shareCurrentUrl()" id="header-share-btn" title="Copy / Share Direct Link to This Exact View"
            class="keep-white-text px-2.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white flex items-center gap-1 shadow-sm transition-all cursor-pointer">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244" />
            </svg>
            <span id="header-share-label" class="hidden sm:inline">Share</span>

            URLs
          </button>

          <!-- Theme Toggle (Light / Dark) -->
          <button onclick="toggleTheme()" id="theme-toggle-btn" title="Switch Light / Dark Background"
            class="px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-emerald-500/20 border border-white/15 text-xs font-bold text-white flex items-center gap-1 transition-all cursor-pointer">
            <span id="theme-toggle-icon">☀️</span>
            <span id="theme-toggle-label" class="hidden xl:inline">Light</span>

          <!-- Font Size Controls (A- / A / A+) -->
          <div class="hidden sm:flex items-center bg-white/5 rounded-xl p-0.5 border border-white/15" title="Adjust Font Size">
            <button onclick="changeFontScale(-1)" class="px-2 py-1 rounded-lg text-xs font-extrabold text-slate-300 hover:text-white hover:bg-white/10 transition-all cursor-pointer">A-</button>
            <button onclick="resetFontScale()" id="font-scale-indicator" class="px-1.5 py-1 text-[11px] font-mono font-bold text-emerald-300 cursor-pointer">100%</button>
            <button onclick="changeFontScale(1)" class="px-2 py-1 rounded-lg text-xs font-extrabold text-slate-300 hover:text-white hover:bg-white/10 transition-all cursor-pointer">A+</button>
          </div>

          <!-- Language Switcher (EN | VI | KO) -->
          <div class="flex items-center gap-0.5 bg-white/5 p-0.5 rounded-xl border border-white/15">
            <button onclick="setLanguage('en')" data-lang-btn="en" class="px-2 py-1 rounded-lg text-xs font-bold bg-emerald-600 text-white keep-white-text transition-all cursor-pointer">EN</button>
            <button onclick="setLanguage('vi')" data-lang-btn="vi" class="px-2 py-1 rounded-lg text-xs font-semibold text-slate-300 hover:text-white transition-all cursor-pointer">VI</button>
            <button onclick="setLanguage('ko')" data-lang-btn="ko" class="px-2 py-1 rounded-lg text-xs font-semibold text-slate-300 hover:text-white transition-all cursor-pointer">KO</button>
          </div>

          <!-- Lock Button -->
          <button onclick="lockPresentation()" title="Lock Screen"
            class="p-2 rounded-xl bg-white/5 hover:bg-red-500/20 text-slate-300 hover:text-red-300 border border-white/10 transition-all cursor-pointer">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">

    </div>
  </div>

  <!-- ==========================================================================
       CLICK-TO-REVEAL SLIDE-OVER DRAWER (WITH DIRECT SHARE LINK BUTTON)
       ========================================================================== -->
  <div id="app-drawer-backdrop" onclick="if(event.target === this) closeDrawer()"
    class="hidden opacity-0 fixed inset-0 z-50 flex justify-end bg-slate-950/75 backdrop-blur-sm transition-opacity duration-250">
    <div id="app-drawer-panel" class="w-full max-w-xl bg-slate-900 border-l border-white/20 h-full flex flex-col shadow-2xl transform translate-x-full transition-transform duration-250">
      <div class="px-5 py-4 bg-slate-950/80 border-b border-white/15 flex items-start justify-between gap-3">
        <div class="min-w-0">
          <h3 id="app-drawer-title" class="text-base sm:text-lg font-extrabold text-white"></h3>
          <p id="app-drawer-subtitle" class="text-xs text-blue-300 mt-0.5"></p>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <button onclick="shareCurrentUrl()" title="Share Direct Link to This Drawer"
            class="keep-white-text px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white flex items-center gap-1.5 transition-all cursor-pointer">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244" />
            </svg>
            <span id="drawer-share-btn-text">Share Link</span>
          </button>
          <button onclick="closeDrawer()" class="p-2 rounded-xl bg-white/10 hover:bg-white/20 text-slate-300 hover:text-white transition-colors cursor-pointer">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>
      <div id="app-drawer-body" class="p-5 sm:p-6 overflow-y-auto flex-1"></div>
    </div>
  </div>

  <!-- ==========================================================================
       SHARE LINK CONFIRMATION TOAST
       ========================================================================== -->
  <div id="share-toast" class="opacity-0 translate-y-4 pointer-events-none fixed bottom-20 lg:bottom-6 left-1/2 -translate-x-1/2 z-50 max-w-md w-[92%] sm:w-auto rounded-2xl bg-slate-900/95 border border-emerald-500/60 px-4 py-3 shadow-2xl flex items-center gap-3 transition-all duration-300">
    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 shrink-0"></span>
    <div class="min-w-0">
      <div id="share-toast-title" class="text-xs font-extrabold text-emerald-300">Link Copied to Clipboard!</div>
      <div id="share-toast-url" class="text-[11px] font-mono text-slate-300 truncate"></div>
    </div>
  </div>

  <!-- ==========================================================================
       SECURITY TOAST NOTIFICATION
       ========================================================================== -->
  <div id="security-toast" class="opacity-0 translate-y-4 pointer-events-none fixed bottom-20 lg:bottom-6 right-4 z-50 max-w-xs rounded-2xl bg-slate-900/95 border border-red-500/50 px-4 py-2.5 shadow-2xl flex items-center gap-2.5 transition-all duration-300">
    <span class="w-2 h-2 rounded-full bg-red-500 shrink-0 animate-ping"></span>
    <span id="security-toast-text" class="text-xs font-semibold text-red-200">
      Confidential Presentation
    </span>
  </div>

  <!-- Application Scripts -->
  <script src="/data-i18n.js" onerror="var s=document.createElement('script');s.src='data-i18n.js';document.body.appendChild(s);"></script>
  <script src="/app.js" onerror="var s=document.createElement('script');s.src='app.js';document.body.appendChild(s);"></script>
</body>
</html>
